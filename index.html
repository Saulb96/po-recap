    if (had && had.distro) await delItem(distroPath(b.id, had));
    await updateIndex(putEntry(data));
    setSave("Removed PO " + po);
    renderBuy();
  } catch(e){ setSave("Not removed: " + errMsg(e), true); }
}

/* ============================== EVENTS ============================== */
function route(){
  const m = /^#\/buy\/([\w-]+)$/.exec(location.hash);
  if (m) openBuy(decodeURIComponent(m[1])); else showHome();
}
function pickFiles(){
  if (!dropTarget() || S.job) return;
  const f = $("#filePick"); f.value = ""; f.click();
}
function wire(){
  $("#signOut").onclick = () => msalApp && msalApp.logoutRedirect({ postLogoutRedirectUri:redirectUri });
  // hover tips: one box, beside whatever carries data-tip (below it, or above when there's no room)
  const tip = $("#tip");
  document.addEventListener("mouseover", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t){ tip.hidden = true; return; }
    // measured at the top left first: left where the last tip was, it would come out squeezed against the edge
    tip.style.left = "0px"; tip.style.top = "0px";
    tip.textContent = t.dataset.tip; tip.hidden = false;
    const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let y = r.bottom + 6;
    if (y + h > innerHeight - 8) y = r.top - h - 6;
    tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
    tip.style.top = Math.max(8, y) + "px";
  });
  addEventListener("scroll", () => { tip.hidden = true; }, true);
  addEventListener("hashchange", () => { tip.hidden = true; });
  // and goes when the pointer leaves the page or the window loses focus
  document.addEventListener("mouseout", e => { if (!e.relatedTarget) tip.hidden = true; });
  addEventListener("blur", () => { tip.hidden = true; });
  document.addEventListener("visibilitychange", () => { if (document.hidden) tip.hidden = true; });
  addEventListener("hashchange", route);
  const fromPicker = input => () => { const k = dropTarget(); if (k && input.files.length) startJob(S.view === "home" ? "new" : "add", k, pickedEntries(input.files)); };
  $("#filePick").onchange = fromPicker($("#filePick"));
  $("#folderPick").onchange = fromPicker($("#folderPick"));
  let dragN = 0;
  const over = on => { const d = $("#drop"); if (d) d.classList.toggle("over", on && !!dropTarget() && !S.job); };
  addEventListener("dragenter", e => { if (e.dataTransfer && [...e.dataTransfer.types].indexOf("Files") >= 0){ dragN++; over(true); } });
  addEventListener("dragleave", () => { dragN = Math.max(0, dragN - 1); if (!dragN) over(false); });
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", e => {
    e.preventDefault(); dragN = 0; over(false);
    if (!e.dataTransfer || !e.dataTransfer.files.length || S.job) return;
    const k = dropTarget();
    if (!k){ if (S.view === "home") setSave("Pick a customer first, then drop the POs in.", true); return; }
    const kind = S.view === "home" ? "new" : "add";
    dropEntries(e.dataTransfer).then(entries => startJob(kind, k, entries), err => setSave("The dropped files couldn't be opened: " + errMsg(err), true));
  });
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (t){
      const a = t.dataset.act;
      if (t.tagName === "A") e.preventDefault();
      if (a === "pick") return;   // a ticked PO: handled on change
      if (a === "cancelJob"){ if (S.job){ S.job.cancelled = true; if (S.job.phase === "check") endJob(); } }
      else if (a === "saveJob") saveJob();
      else if (a === "exportSel") exportBuys([...S.sel]);
      else if (a === "exportOne" && S.buy) exportBuys([S.buy.id]);
      else if (a === "addOpen"){ S.adding = true; renderBuy(); }
      else if (a === "addClose"){ if (S.job && S.job.phase === "saving") return; dropJob(); S.adding = false; renderBuy(); }
      else if (a === "delBuy") deleteBuy();
      else if (a === "rmPo") removePo(t.dataset.po);
      else if (a === "pickFolder"){ if (dropTarget() && !S.job){ const f = $("#folderPick"); f.value = ""; f.click(); } }
      else if (a === "readFob") readFobFromPdfs();
      else if (a === "masterRetry") loadMaster(true);
      else if (a === "pickClear"){ S.pick.clear(); renderBuy(); }
      else if (a === "pickMove") moveDialog();
      else if (a === "taskCancel"){ if (S.task) S.task.cancelled = true; }
      return;
    }
    if (e.target.closest("#drop")) pickFiles();
  });
  document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop"){ e.preventDefault(); pickFiles(); } });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "cust"){ LS.set("customer", t.value); syncDrop(); }
    else if (t.id === "filt"){ S.filter = t.value; LS.set("filter", t.value); renderBuys(); }
    else if (t.dataset.act === "sel"){ t.checked ? S.sel.add(t.dataset.id) : S.sel.delete(t.dataset.id); renderBuys(); }
    else if (t.dataset.act === "selAll"){
      const ids = S.index.buys.filter(b => !S.filter || b.customer === S.filter).map(b => b.id);
      ids.forEach(id => t.checked ? S.sel.add(id) : S.sel.delete(id)); renderBuys();
    }
    else if (t.dataset.act === "pick"){ t.checked ? S.pick.add(t.dataset.po) : S.pick.delete(t.dataset.po); syncPick(); }
  });
  document.addEventListener("input", e => { if (e.target.id === "jobName" && S.job) S.job.name = e.target.value; else schedule(e.target); });
  document.addEventListener("focusout", e => { if (fieldOf(e.target) && S.timers.has(fieldKey(fieldOf(e.target)))) flush(e.target); });
  addEventListener("beforeunload", e => { if (S.timers.size || (S.job && S.job.phase === "saving") || S.task){ e.preventDefault(); e.returnValue = ""; } });
}

/* ============================== INIT ================================ */
function gateMsg(html){ $("#gateMsg").innerHTML = html; }
async function start(){
  if (typeof msal === "undefined"){ gateMsg('<span style="color:var(--bad)">The Microsoft sign-in library didn\'t load (alcdn.msauth.net blocked?).</span>'); return; }
  if (typeof pdfjsLib === "undefined"){ gateMsg('<span style="color:var(--bad)">The PDF reader didn\'t load (cdnjs.cloudflare.com blocked?).</span>'); return; }
  if (!R){ gateMsg('<span style="color:var(--bad)">recap.js didn\'t load.</span>'); return; }
  if (!R.TONES || !R.cellText || !R.readMarmaxxDistro || !window.Mail){ gateMsg('<span style="color:var(--bad)">This browser kept an older copy of the page\'s files. Reload it with Ctrl+F5.</span>'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = CFG.pdfWorker;
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId:CFG.clientId, authority:"https://login.microsoftonline.com/" + CFG.tenantId, redirectUri },
    cache:{ cacheLocation:"localStorage", storeAuthStateInCookie:false }
  });
  await msalApp.initialize();
  const rr = await msalApp.handleRedirectPromise().catch(e => { console.error(e); return null; });
  const acct = (rr && rr.account) || msalApp.getAllAccounts()[0];
  if (!acct){
    gateMsg("");
    $("#signIn").style.display = "";
    $("#signIn").onclick = () => framed
      ? msalApp.loginPopup({ scopes:CFG.scopes }).then(r => { S.acct = r.account; msalApp.setActiveAccount(r.account); boot(); })
      : msalApp.loginRedirect({ scopes:CFG.scopes });
    return;
  }
  S.acct = acct; msalApp.setActiveAccount(acct);
  boot();
}
async function boot(){
  try {
    $("#signIn").style.display = "none";
    gateMsg('<div class="spin"></div>Connecting to SharePoint…');
    await resolveDrive();
    $("#whoName").textContent = me();
    $("#gate").style.display = "none";
    $("#app").style.display = "";
    wire();
    route();
  } catch(e){
    console.error(e);
    gateMsg('<span style="color:var(--bad)">' + (e.status === 401 || e.status === 403
      ? "Signed in, but you don't have access to " + esc(e.site || "the SharePoint site") + ". Ask Saul to add you."
      : e.status === 404 && e.site
      ? "There's no SharePoint site at " + esc(CFG.host + e.site) + "."
      : esc(errMsg(e))) + "</span>");
  }
}
start();
</script>
