<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M1S · PO Recap</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --ink:#16202c; --muted:#5f6c7d; --faint:#8a96a6;
  --glass:rgba(255,255,255,.62); --edge:rgba(255,255,255,.75);
  --shadow:0 8px 32px rgba(31,45,75,.12);
  --accentink:#1b6fae; --grid:rgba(95,108,125,.16);
  --good:#2f7d4f; --good-soft:rgba(63,125,88,.15);
  --warn:#9a6b2f; --warn-soft:rgba(154,107,47,.13);
  --bad:#b4452f; --bad-soft:rgba(180,69,47,.12);
  --ring:rgba(47,155,214,.18); --win:#d9eaf7; --fz:#f7fafd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:14px;line-height:1.45;color:var(--ink);
  background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
#app{height:100%;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex:0 0 auto;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--edge);box-shadow:0 2px 14px rgba(31,45,75,.06);
}
.brand{font-weight:700;font-size:15px;color:var(--ink);text-decoration:none}
.spacer{flex:1}
.who{font-size:12.5px;color:var(--muted)}
button{font-family:inherit;cursor:pointer}
.btn{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.75);color:var(--ink);white-space:nowrap}
.btn:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{color:#fff;background:linear-gradient(135deg,#2f9bd6,#1b6fae)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.icon{border:none;background:none;padding:3px 7px;border-radius:7px;color:var(--muted);line-height:1;font-size:13px}
.icon:hover{background:rgba(255,255,255,.9);color:var(--bad)}
a{color:var(--accentink)}
.main{flex:1;overflow:auto;padding:18px 20px 40px}
.wrap{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.card-hd{padding:11px 16px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-hd h2{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card-bd{padding:14px 16px}
input,select{font-family:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.8);border:1px solid var(--edge);border-radius:11px;padding:8px 12px;width:100%;outline:none}
input:focus,select:focus{background:#fff;box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accentink);cursor:pointer;padding:0}
select.sm{width:auto;padding:6px 10px;font-size:12px}
label.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
label.fld > span,.lbl{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted)}
.save{font-size:11.5px;color:var(--muted);max-width:520px;text-align:right}
.save.err{color:var(--bad);font-weight:600}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.spin{width:15px;height:15px;border:2px solid var(--ring);border-top-color:var(--accentink);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.inline-load{display:flex;align-items:center;gap:9px;padding:16px;color:var(--muted);font-size:12.5px}
.gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}
.gate .card{padding:32px 40px;text-align:center;display:flex;flex-direction:column;gap:15px;align-items:center;max-width:440px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}

/* ---------- new buy ---------- */
.imp{display:flex;gap:14px;align-items:stretch;padding:12px 14px;flex-wrap:wrap}
.imp .cust{flex:0 0 240px}
.drop{flex:1 1 420px;display:flex;align-items:center;gap:12px;border:1.5px dashed rgba(95,108,125,.38);border-radius:14px;padding:10px 14px;cursor:pointer;background:rgba(255,255,255,.35)}
.drop:hover,.drop.over{border-color:var(--accentink);background:rgba(47,155,214,.07)}
.drop.off{cursor:not-allowed;opacity:.55}
.drop.off:hover{border-color:rgba(95,108,125,.38);background:rgba(255,255,255,.35)}
.drop b{font-size:13px}
.drop .hint{display:block;margin-top:1px}
.drop .arrow{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f9bd6,#1b6fae);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.job{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.job:empty{display:none}
.strip{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--edge);font-size:12.5px}
.strip.ok{background:var(--good-soft);color:var(--good)}
.strip.err{background:var(--bad-soft);color:var(--bad)}
.strip.warn{background:var(--warn-soft);color:var(--warn)}
.strip.busy{align-items:center}
.strip ul{list-style:none;display:flex;flex-direction:column;gap:3px;width:100%}
.strip li{color:var(--ink)}
.strip li .why{color:inherit}
.strip.err li .why{color:var(--bad)}
.strip b{font-weight:700}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row .grow{flex:1 1 320px}

/* ---------- tables ---------- */
table.t{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.t th{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t .n{text-align:right}
.t tbody tr:hover td{background:rgba(255,255,255,.5)}
.t td.c{width:34px}
.t a.open{font-weight:600;text-decoration:none}
.t a.open:hover{text-decoration:underline}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.badge.none{background:none;color:var(--faint);font-weight:500}
.tw{overflow:auto}

/* ---------- a buy ---------- */
.back{font-size:12.5px;font-weight:600;text-decoration:none}
.head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:14px 16px}
.head .name{flex:1 1 380px}
.head .name input{font-size:20px;font-weight:700;padding:6px 10px}
.meta{padding:0 16px 14px;font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpi .v.bad{color:var(--bad)} .kpi .v.warn{color:var(--warn)}
.kpi{padding:13px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.pair{grid-template-columns:1fr}}
.flags{list-style:none;padding:10px 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.flags li{display:flex;gap:9px;align-items:flex-start}
.flags li::before{content:"⚑";color:var(--warn)}

/* the recap grid: its own scroll pane, three sticky heading rows, Style / Description / Cost frozen */
.tbl-scroll{overflow:auto;max-height:calc(100vh - 150px);border-radius:0 0 18px 18px}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
.g th,.g td{padding:5px 9px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);white-space:nowrap;background:#fbfcfe}
.g thead th{position:sticky;z-index:3;background:#f0f5fb;font-size:10.5px;font-weight:700;color:var(--muted);height:27px;text-align:center}
.g thead tr.h0 th{top:0}
.g thead tr.h1 th{top:27px}
.g thead tr.h2 th{top:54px}
.g thead th.win{background:var(--win);color:var(--ink)}
.g thead th.lab{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;vertical-align:bottom;padding-bottom:8px}
.g thead tr.h2 a{font-weight:700;text-decoration:none;color:var(--ink)}
.g thead tr.h2 a:hover{color:var(--accentink);text-decoration:underline}
.g .fz{position:sticky;z-index:2;background:var(--fz)}
.g thead .fz{z-index:4;background:#f0f5fb}
.g .c-style{left:0;min-width:108px;max-width:108px}
.g .c-desc{left:108px;min-width:250px;max-width:250px;overflow:hidden;text-overflow:ellipsis}
.g .c-cost{left:358px;min-width:100px;max-width:100px;overflow:hidden;text-overflow:ellipsis;box-shadow:inset -2px 0 0 var(--grid)}
.g td.n,.g th.n{text-align:right}
.g td.n.blank{color:var(--faint)}
.g td.tot{font-weight:700}
.g tfoot td{position:sticky;bottom:0;z-index:2;background:#e8eff8;font-weight:700}
.g tfoot td.fz{z-index:3;background:#e8eff8}
.g td.note{padding:2px 4px;min-width:240px}
.g input.note{padding:4px 8px;font-size:12px;border-radius:8px;border-color:transparent;background:transparent}
.g input.note:hover{border-color:var(--edge);background:rgba(255,255,255,.7)}
.g input.note:focus{background:#fff;border-color:var(--edge)}
.g .flag{color:var(--warn);margin-left:4px;cursor:help}
.g .wst{border-left:2px solid rgba(95,108,125,.34)}
.g .c-cost{box-shadow:none}
.g .c-pack{left:458px;min-width:70px;max-width:70px;box-shadow:inset -2px 0 0 var(--grid)}
.g thead tr.h2 th label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.g thead tr.h2 input[type=checkbox]{width:13px;height:13px}
.g .dd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;vertical-align:1px;background:#c6ced9}
.g .dd.ok{background:var(--good)} .g .dd.bad{background:var(--bad)}
.pickbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--grid);background:rgba(47,155,214,.08);font-size:12.5px}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-right:2px;flex:0 0 auto}
.drops{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.dist{border-top:1px solid var(--grid)}
details.dist > summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:9px 16px;font-size:12.5px;flex-wrap:wrap}
details.dist > summary::-webkit-details-marker{display:none}
details.dist > summary::before{content:"▸";color:var(--muted);font-size:11px}
details.dist[open] > summary::before{content:"▾"}
details.dist .tw{padding:0 16px 12px}
.t td.bad{background:#ffc7ce;color:#9c0006;font-weight:600;cursor:help}
.ok-t{color:var(--good);font-weight:600} .bad-t{color:var(--bad);font-weight:600} .muted{color:var(--muted)}
.modal label.fld{margin-top:2px}
/* a style whose cost or description varies between POs: Excel's light red with dark red text, above the window colours */
.g tbody tr td.bad{background:#ffc7ce;color:#9c0006;font-weight:600;cursor:help}
.g tbody tr td.bad:hover{box-shadow:inset 0 0 0 2px #9c0006}
#tip{position:fixed;z-index:20;max-width:440px;padding:8px 11px;border-radius:10px;background:#16202c;color:#fff;font-size:12px;line-height:1.5;white-space:pre-line;pointer-events:none;box-shadow:0 8px 24px rgba(22,32,44,.28)}
#tip[hidden]{display:none}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(22,32,44,.12)}

/* confirm */
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(22,32,44,.28)}
.modal[hidden]{display:none}
.modal .card{background:#fff;padding:22px 24px;max-width:460px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:16px}
.modal p{font-size:13px;color:var(--muted)}
.modal .row{justify-content:flex-end}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <div class="brand">PO Recap</div>
    <div class="hint">Customer POs, read and summarized by buy</div>
    <div id="gateMsg" class="inline-load"><div class="spin"></div>Loading…</div>
    <button class="btn primary" id="signIn" style="display:none">Sign in with Microsoft</button>
  </div>
</div>

<div id="app" style="display:none">
  <header class="topbar">
    <a class="brand" href="#/">PO Recap</a>
    <div class="spacer"></div>
    <span class="save" id="saveSt" role="status" aria-live="polite"></span>
    <span class="who" id="whoName"></span>
    <button class="btn sm" id="signOut">Sign out</button>
  </header>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <p id="mBody"></p>
    <div class="row"><button class="btn" id="mCancel">Cancel</button><button class="btn danger solid" id="mOk"></button></div>
  </div>
</div>

<div id="tip" role="tooltip" hidden></div>
<input type="file" id="filePick" accept=".pdf,.eml,.msg,.xlsx,.xls,application/pdf" multiple style="display:none">
<input type="file" id="folderPick" webkitdirectory multiple style="display:none">

<div class="modal" id="moveBox" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mvTitle">
    <h3 id="mvTitle"></h3>
    <p id="mvBody"></p>
    <label class="fld"><span>Move them to</span><select id="mvTo"></select></label>
    <label class="fld" id="mvNameRow"><span>New buy's name</span><input id="mvName" maxlength="80"></label>
    <div class="row"><button class="btn" id="mvCancel">Cancel</button><button class="btn primary" id="mvOk">Move</button></div>
  </div>
</div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="recap.js?v=20261030a"></script>
<script src="mail.js?v=20261030a"></script>
<script>
"use strict";
/* ============================== CONFIG ============================== */
const CFG = {
  clientId: "b0bd48e4-4d48-40f5-abb9-f4fad60d2a5a",          // the "PO Summarizer" app registration
  tenantId: "eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
  host    : "met1sol.sharepoint.com",
  scopes  : ["User.Read", "Sites.ReadWrite.All"],
  site    : "/sites/Sales",
  drive   : "Documents",
  root    : "Sales/Other/PO Recap",                           // in Documents: index.json, Buys/<id>.json, Buys/<id>/<PO #>.pdf
  admins  : ["saul@metro1solutions.com"],                     // only these sign-ins see Delete and Remove
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  msgReader: "https://cdn.jsdelivr.net/npm/@kenjiuno/msgreader@1.22.0/+esm",   // Outlook .msg emails, loaded when one is dropped
  // Case packs are checked against this, read only: the same file and sharing link the PO Book reads
  master  : { url:"https://met1sol.sharepoint.com/:x:/s/Production/IQBIuuE0Jan6RaTDWpWOz8W-AZzN3lzg4rcL1r0SraBDZ_c?e=hshN16", sheet:"Master Sheet Live", name:"Master Sheet Live.xlsx" }
};
const G = "https://graph.microsoft.com/v1.0";
const PATHS = {
  index: CFG.root + "/index.json",
  buys : CFG.root + "/Buys",
  buy  : id => CFG.root + "/Buys/" + id + ".json",
  dir  : id => CFG.root + "/Buys/" + id,
  pdf  : (id, po) => CFG.root + "/Buys/" + id + "/" + po + ".pdf",
  // a distro's file carries its version, so a newer one never overwrites the one in use before it's saved
  distro: (id, po, v, ext) => CFG.root + "/Buys/" + id + "/" + po + "-distro-v" + (v || 0) + "." + (ext || "pdf")
};
const distroPath = (id, p) => PATHS.distro(id, p.po, p.distro.version, p.distro.file && p.distro.file.ext);
const extOf = name => { const m = /\.([a-z0-9]{2,5})$/i.exec(String(name || "")); return m ? m[1].toLowerCase() : ""; };
const R = window.Recap;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const errMsg = e => (e && e.message) || String(e);
const isAdmin = () => !!(S.acct && CFG.admins.indexOf(String(S.acct.username || "").toLowerCase()) >= 0);
const me = () => (S.acct && (S.acct.name || S.acct.username)) || "";
const dayOf = t => { const d = new Date(t); return isNaN(d) ? "" : (d.getMonth() + 1) + "/" + d.getDate() + "/" + d.getFullYear(); };
/* An error while the page starts shows on the loading card, never an endless spinner */
function failGate(e){
  const g = document.getElementById("gate"), m = document.getElementById("gateMsg");
  if (!g || !m || g.style.display === "none") return;
  m.innerHTML = '<span style="color:var(--bad)">The page didn\'t start: ' + esc(errMsg(e)) + ". Reload it with Ctrl+F5. If this stays, send this message to Saul.</span>";
}
addEventListener("error", e => failGate(e.error || e.message));
addEventListener("unhandledrejection", e => failGate(e.reason));
/* Ship window colours (recap.js TONES, shared with the Excel sheet): .tN headings in the stronger shade, cells lighter */
(function(){
  if (!R || !R.TONES) return;
  const s = document.createElement("style");
  s.textContent = R.TONES.map(([head, cell], i) =>
    ".g thead th.t" + i + ",.g tfoot td.t" + i + ",.sw.t" + i + "{background:#" + head + "}.g tbody td.t" + i + "{background:#" + cell + "}").join("");
  document.head.appendChild(s);
})();
const swatch = tone => tone == null ? "" : '<i class="sw t' + tone + '" aria-hidden="true"></i>';
const LS = {
  get(k, d){ try { const v = localStorage.getItem("porecap." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("porecap." + k, JSON.stringify(v)); } catch(e){} }
};

/* ============================== STATE =============================== */
const S = {
  acct:null, driveId:null, driveWeb:null,
  index:null,                 // { v, buys:[entry] }, newest read of index.json
  view:"home", buy:null, buyTag:null,
  job:null,                   // a read / check / save in progress: { kind:"new"|"add", key, files, phase, ... }
  adding:false,               // the buy page's Add POs panel is open
  sel:new Set(), filter:LS.get("filter", ""),
  base:new Map(), timers:new Map(), chain:Promise.resolve(),
  pick:new Set(),             // POs ticked at the top of the recap, to move to another buy
  master:null,                // Master Sheet Live: { data, at } once read, { error } if it couldn't be, { loading }
  task:null                   // a buy-page task in progress (reading FOB, moving POs): { what, cancelled }
};

/* ============================== MSAL ================================ */
const redirectUri = window.location.origin + window.location.pathname;
const framed = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();
let msalApp = null;
async function getToken(){
  const r = await msalApp.acquireTokenSilent({ scopes:CFG.scopes, account:S.acct })
    .catch(async () => framed
      ? msalApp.acquireTokenPopup({ scopes:CFG.scopes })
      : (msalApp.acquireTokenRedirect({ scopes:CFG.scopes }), new Promise(() => {})));
  return r.accessToken;
}

/* ============================== GRAPH =============================== */
async function gf(path, opts){
  opts = opts || {};
  const tok = await getToken();
  const h = Object.assign({ Authorization:"Bearer " + tok }, opts.headers || {});
  if (opts.body && typeof opts.body === "string" && !h["Content-Type"]) h["Content-Type"] = "application/json";
  const res = await fetch(/^https?:/.test(path) ? path : G + path, { method:opts.method || "GET", headers:h, body:opts.body });
  if (res.status === 429 || res.status === 503){
    await new Promise(r => setTimeout(r, parseInt(res.headers.get("Retry-After") || "3", 10) * 1000));
    return gf(path, opts);
  }
  if (!res.ok){
    const txt = await res.text().catch(() => "");
    const err = new Error("SharePoint said " + res.status + ": " + txt.slice(0, 240));
    err.status = res.status; throw err;
  }
  if (res.status === 204 || res.status === 202) return null;
  return (res.headers.get("Content-Type") || "").indexOf("json") >= 0 ? res.json() : null;
}
async function gAll(path){
  const out = []; let next = path;
  while (next){ const p = await gf(next); if (p && p.value) out.push.apply(out, p.value); next = p && p["@odata.nextLink"]; }
  return out;
}
const itemUrl = p => "/drives/" + S.driveId + "/root:/" + encPath(p);
/* A PO's PDF where it is now (the folder can be moved; the webUrl saved at upload is the fallback) */
const pdfLink = (b, p) => S.driveWeb ? S.driveWeb + "/" + encPath(PATHS.pdf(b.id, p.po)) : (p.file && p.file.webUrl) || "";
async function resolveDrive(){
  try {
    const s = await gf("/sites/" + CFG.host + ":" + CFG.site + "?$select=id");
    const drives = await gAll("/sites/" + s.id + "/drives?$select=id,name,webUrl");
    const d = drives.find(x => x.name === CFG.drive) || drives[0];
    if (!d) throw new Error("No document library on " + CFG.site);
    S.driveId = d.id; S.driveWeb = d.webUrl;
  } catch(e){ e.site = CFG.site; throw e; }
}
/* JSON files: read through the pre-authenticated downloadUrl (a /content 302 is blocked by CORS), with their eTag */
async function readJson(path){
  let it;
  try { it = await gf(itemUrl(path)); } catch(e){ if (e.status === 404) return null; throw e; }
  const r = await fetch(it["@microsoft.graph.downloadUrl"], { cache:"no-store" });
  if (!r.ok) throw new Error("Download " + r.status + " for " + path);
  return { data:await r.json(), etag:it.eTag };
}
const madeDirs = new Set();
async function ensurePath(dir){
  const at = p => itemUrl(p);
  let cur = "";
  for (const seg of dir.split("/").filter(Boolean)){
    const parent = cur; cur = cur ? cur + "/" + seg : seg;
    if (madeDirs.has(cur)) continue;
    try { await gf(at(cur) + "?$select=id"); }
    catch(e){
      if (e.status !== 404) throw e;
      try {
        await gf(parent ? at(parent) + ":/children" : "/drives/" + S.driveId + "/root/children",
          { method:"POST", body:JSON.stringify({ name:seg, folder:{}, "@microsoft.graph.conflictBehavior":"fail" }) });
      } catch(e2){ if (e2.status !== 409) throw e2; }
    }
    madeDirs.add(cur);
  }
}
/* If-Match when we hold an eTag, create-only when we don't: someone else's save in between is a 412, never overwritten */
async function writeJson(path, data, etag){
  await ensurePath(path.slice(0, path.lastIndexOf("/")));
  const h = { "Content-Type":"text/plain" };
  if (etag) h["If-Match"] = etag;
  const q = etag ? "" : "?@microsoft.graph.conflictBehavior=fail";
  try {
    const it = await gf(itemUrl(path) + ":/content" + q, { method:"PUT", headers:h, body:JSON.stringify(data) });
    return it && it.eTag;
  } catch(e){ if (e.status === 409) e.status = 412; throw e; }
}
async function delItem(path){ try { await gf(itemUrl(path), { method:"DELETE" }); } catch(e){ if (e.status !== 404) throw e; } }
/* A file's bytes, through its pre-authenticated downloadUrl */
async function downloadBytes(pathOrItem){
  const it = typeof pathOrItem === "string" ? await gf(itemUrl(pathOrItem)) : pathOrItem;
  const r = await fetch(it["@microsoft.graph.downloadUrl"], { cache:"no-store" });
  if (!r.ok) throw new Error("Download " + r.status + " for " + (it.name || pathOrItem));
  return new Uint8Array(await r.arrayBuffer());
}
/* Move a file into another folder of the same library, keeping its name */
async function moveItem(path, toDir){
  await ensurePath(toDir);
  return gf(itemUrl(path), { method:"PATCH", body:JSON.stringify({ parentReference:{ path:"/drives/" + S.driveId + "/root:/" + toDir } }) });
}
/* Master Sheet Live, read only, through its sharing link (the PO Book's): each style's rows with their case pack */
async function readMaster(){
  const share = "u!" + btoa(unescape(encodeURIComponent(CFG.master.url))).replace(/=+$/, "").replace(/\//g, "_").replace(/\+/g, "-");
  let it;
  try { it = await gf("/shares/" + share + "/driveItem", { headers:{ Prefer:"redeemSharingLinkIfNecessary" } }); }
  catch(e){ throw new Error(e.status === 403 || e.status === 401 ? "you don't have access to " + CFG.master.name + " in Production" : e.status === 404 ? CFG.master.name + " wasn't found at its link" : errMsg(e)); }
  const wb = XLSX.read(await downloadBytes(it), { type:"array" });
  const ws = wb.Sheets[CFG.master.sheet];
  if (!ws) throw new Error(CFG.master.name + " has no \"" + CFG.master.sheet + "\" tab");
  const data = R.parseMaster(XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null }));
  if (!data) throw new Error("the \"" + CFG.master.sheet + "\" tab has no Style Number / Master headings");
  return data;
}
async function uploadPdf(path, file, type){
  if (file.size <= 4 * 1024 * 1024)
    return gf(itemUrl(path) + ":/content?@microsoft.graph.conflictBehavior=replace", { method:"PUT", headers:{ "Content-Type":type || file.type || "application/pdf" }, body:file });
  const s = await gf(itemUrl(path) + ":/createUploadSession", { method:"POST", body:JSON.stringify({ item:{ "@microsoft.graph.conflictBehavior":"replace" } }) });
  const CHUNK = 320 * 1024 * 16;
  for (let at = 0; at < file.size; at += CHUNK){
    const end = Math.min(at + CHUNK, file.size);
    const r = await fetch(s.uploadUrl, { method:"PUT", headers:{ "Content-Range":"bytes " + at + "-" + (end - 1) + "/" + file.size }, body:file.slice(at, end) });
    if (!r.ok) throw new Error("Upload of " + file.name + " stopped (" + r.status + ")");
    if (end === file.size) return r.json();
  }
}

/* ============================== THE BUYS LIST (index.json) ============================== */
const normIndex = d => ({ v:1, buys:(d && Array.isArray(d.buys)) ? d.buys : [] });
function entryOf(b){
  const rc = R.recap(b);
  return { id:b.id, name:b.name, customer:b.customer, created:b.created, by:b.by, updated:b.updated,
           pos:b.pos.map(p => p.po), units:rc.total.units, cost:rc.total.ext, flags:R.flags(b.customer, b.pos).length };
}
async function loadIndex(){
  const got = await readJson(PATHS.index);
  if (got){ S.index = normIndex(got.data); return; }
  // no list yet: build it from the buy files, if there are any
  let kids = [];
  try { kids = await gAll(itemUrl(PATHS.buys) + ":/children?$select=name,file"); } catch(e){ if (e.status !== 404) throw e; }
  const buys = [];
  for (const k of kids.filter(k => k.file && /\.json$/i.test(k.name))){
    const b = await readJson(PATHS.buys + "/" + k.name);
    if (b && b.data && Array.isArray(b.data.pos)) buys.push(entryOf(b.data));
  }
  S.index = { v:1, buys };
  if (buys.length) await updateIndex(ix => { for (const e of buys) if (!ix.buys.some(x => x.id === e.id)) ix.buys.push(e); });
}
/* Read, change, write with If-Match; a 412 (someone else saved the list) reads it again and makes the change again */
async function updateIndex(fn){
  for (let n = 0; n < 5; n++){
    const cur = await readJson(PATHS.index);
    const data = normIndex(cur && cur.data);
    fn(data);
    try { await writeJson(PATHS.index, data, cur && cur.etag); S.index = data; return; }
    catch(e){ if (e.status !== 412) throw e; }
  }
  throw new Error("The buys list kept changing while it was being saved. Reload the page.");
}
const putEntry = b => ix => { ix.buys = ix.buys.filter(x => x.id !== b.id); ix.buys.push(entryOf(b)); };

/* ============================== A BUY FILE ============================== */
function setBuy(data, etag){ S.buy = data; S.buyTag = etag; }
/* Change a buy with fn(data) on its newest copy: If-Match, and on a 412 read it again and make the change again.
   fn throws when the change can't be made on what's there now (a field someone else changed). */
async function mutateBuy(id, fn){
  let cur = S.buy && S.buy.id === id ? { data:S.buy, etag:S.buyTag } : await readJson(PATHS.buy(id));
  for (let n = 0; n < 5; n++){
    if (!cur) throw new Error("This buy isn't there any more: someone deleted it.");
    const data = JSON.parse(JSON.stringify(cur.data));
    fn(data);
    data.updated = new Date().toISOString(); data.updatedBy = me();
    try {
      const etag = await writeJson(PATHS.buy(id), data, cur.etag);
      if (S.buy && S.buy.id === id) setBuy(data, etag);
      return data;
    } catch(e){
      if (e.status !== 412) throw e;
      cur = await readJson(PATHS.buy(id));
    }
  }
  throw new Error("The buy kept changing while it was being saved. Reload and try again.");
}

/* ============================== READING PDFs ============================== */
const CANCELLED = new Error("Cancelled");
/* A PDF as pages of positioned text. Positions go through the page's viewport, so a page whose origin isn't its
   bottom left corner (TJX's distribution PDFs) reads like any other; y is measured up from the bottom. */
async function pdfPages(file, job){
  // a copy: pdf.js hands the bytes to its worker, which would leave the caller's empty
  const bytes = file instanceof Uint8Array ? file.slice() : new Uint8Array(await file.arrayBuffer());
  const doc = await pdfjsLib.getDocument({ data:bytes }).promise;
  try {
    const pages = [];
    for (let n = 1; n <= doc.numPages; n++){
      if (job.cancelled) throw CANCELLED;
      const page = await doc.getPage(n);
      const vp = page.getViewport({ scale:1 });
      const tc = await page.getTextContent();
      const items = [];
      for (const i of tc.items) if (i.str && i.str.trim()){
        const [x, y] = vp.convertToViewportPoint(i.transform[4], i.transform[5]);
        items.push({ s:i.str.trim(), x, y:vp.height - y, w:i.width });
      }
      const images = [];
      if (n === 1){
        const ops = await page.getOperatorList();
        ops.fnArray.forEach((fn, k) => { if (fn === pdfjsLib.OPS.paintImageXObject) images.push({ w:ops.argsArray[k][1], h:ops.argsArray[k][2] }); });
      }
      pages.push({ n, items, images });
    }
    return pages;
  } finally { doc.destroy(); }
}

/* ============================== WHAT CAN BE DROPPED ============================== */
// PDFs (POs and distros), Excel distribution sheets, and saved emails (.eml, Outlook .msg) whose attachments are any of
// these, emails attached to emails included. Folders are opened all the way down. Anything else is named in a note.
// An entry is { name, blob }: the name shows where it came from (its folder, or the email it was attached to).
const KIND_OF = { pdf:"pdf", xlsx:"sheet", xls:"sheet", eml:"eml", msg:"msg" };
const kindOf = e => KIND_OF[extOf(e.name)] || (e.blob.type === "application/pdf" ? "pdf" : null);
const baseName = name => String(name).split(" › ").pop().split("/").pop();
function dropEntries(dt){
  // the entries have to be taken now, while the drop event lasts; their files are read after
  const items = [...(dt.items || [])].filter(i => i.kind === "file");
  const roots = items.map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null);
  if (!roots.length || roots.some(e => !e)) return Promise.resolve([...dt.files].map(f => ({ name:f.name, blob:f })));
  const fileOf = e => new Promise((res, rej) => e.file(res, rej));
  const children = dir => new Promise((res, rej) => {
    const r = dir.createReader(), all = [];
    const next = () => r.readEntries(b => { if (!b.length) res(all); else { all.push(...b); next(); } }, rej);
    next();
  });
  const out = [];
  const walk = async (e, path) => {
    if (e.isFile) out.push({ name:path + e.name, blob:await fileOf(e) });
    else if (e.isDirectory) for (const c of await children(e)) await walk(c, path + e.name + "/");
  };
  return (async () => { for (const e of roots) await walk(e, ""); return out.sort((a, b) => a.name.localeCompare(b.name, "en", { numeric:true })); })();
}
const pickedEntries = list => [...list].map(f => ({ name:f.webkitRelativePath || f.name, blob:f })).sort((a, b) => a.name.localeCompare(b.name, "en", { numeric:true }));
let MsgReader = null;
/* An email's subject and attachments ({ name, bytes }); an Outlook email attached to one is opened too */
async function openEmail(e, kind){
  const bytes = new Uint8Array(await e.blob.arrayBuffer());
  if (kind === "eml"){ const m = Mail.parseEml(bytes); return { subject:m.subject, attachments:m.attachments }; }
  if (!MsgReader){
    // jsdelivr's ES module wraps the package's CommonJS exports: the class is default.default
    const m = await import(CFG.msgReader), d = m.default;
    MsgReader = typeof d === "function" ? d : d && typeof d.default === "function" ? d.default : null;
    if (!MsgReader) throw new Error("the Outlook email reader didn't load");
  }
  const out = [], skipped = [];
  const walk = (data, depth) => {
    const r = new MsgReader(data), info = r.getFileData();
    for (const a of info.attachments || []){
      // a cloud link or an embedded object has no file to read: msgreader throws on it, so it's named and skipped
      // instead of losing the email's real attachments with it
      let got = null;
      try { got = r.getAttachment(a); } catch(e){ got = null; }
      if (!got || !got.content){ skipped.push(a.fileName || a.name || "an attachment"); continue; }
      if (a.innerMsgContent && depth < 5) walk(got.content, depth + 1);
      else out.push({ name:got.fileName || a.fileName || "attachment", bytes:got.content });
    }
    return info.subject || "";
  };
  return { subject:walk(bytes, 0), attachments:out, skipped };
}

/* A job: read every file, check the batch, then wait for Save or Cancel. kind "new" makes a buy, "add" adds to S.buy. */
async function startJob(kind, key, entries){
  if (S.job || !entries.length) return;
  const job = S.job = { kind, key, files:new Map(), queue:entries.slice(), total:entries.length, phase:"reading", at:0, cancelled:false, results:[], skipped:[], empty:[] };
  if (kind === "new") job.name = R.defaultName(R.customer(key).name, new Date());
  // each file kept under a name of its own, for the upload
  const keep = (name, blob) => { let n = name, i = 2; while (job.files.has(n)) n = name.replace(/(\.[a-z0-9]+)?$/i, " (" + i++ + ")$1"); job.files.set(n, blob); return n; };
  renderJob();
  try {
    while (job.queue.length){
      if (job.cancelled) throw CANCELLED;
      const e = job.queue.shift(), kind = kindOf(e);
      job.at++; job.current = e.name; renderJob();
      if (!kind){ job.skipped.push(e.name); continue; }
      if (kind === "eml" || kind === "msg"){
        try {
          const m = await openEmail(e, kind);
          for (const n of m.skipped || []) job.skipped.push(e.name + " › " + n + " (a link or an embedded object, not a file)");
          if (!m.attachments.length && !(m.skipped || []).length) job.empty.push(e.name);
          const inner = m.attachments.map(a => ({ name:e.name + " › " + a.name, blob:new Blob([a.bytes], { type:a.type || "" }) }));
          job.queue.unshift(...inner); job.total += inner.length;
        } catch(err){ job.results.push({ file:e.name, error:"This email couldn't be opened: " + errMsg(err) }); }
        continue;
      }
      const name = keep(e.name, e.blob);
      if (kind === "sheet"){
        try {
          const wb = XLSX.read(new Uint8Array(await e.blob.arrayBuffer()), { type:"array" });
          const table = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:null });
          const r = R.readSheet(key, table, baseName(e.name));
          if (r.notDistro){ job.files.delete(name); job.skipped.push(e.name + " (a spreadsheet, not a distribution sheet)"); continue; }
          job.results.push(Object.assign({ file:name }, r));
        } catch(err){ job.results.push({ file:name, error:"This spreadsheet couldn't be opened: " + errMsg(err) }); }
        continue;
      }
      try { job.results.push(Object.assign({ file:name }, R.read(key, await pdfPages(e.blob, job), baseName(e.name)))); }
      catch(err){
        if (err === CANCELLED) throw err;
        job.results.push({ file:name, error:"This PDF couldn't be opened: " + errMsg(err) });
      }
    }
    await recheck(job);
    job.phase = "check";
  } catch(e){
    if (S.job !== job) return;
    if (e === CANCELLED){ endJob(); return; }
    job.phase = "check"; job.failed = errMsg(e);
  }
  if (S.job === job) renderJob();
}
/* Leaving the page a job is on stops it */
function dropJob(){ if (S.job){ S.job.cancelled = true; S.job = null; } }
/* The checks run against the newest buys list, so a PO someone else saved a moment ago is caught */
async function recheck(job){
  if (job.kind === "add" && !S.buy) throw CANCELLED;
  await loadIndex();
  const here = job.kind === "add" ? S.buy.pos.map(p => p.po) : [];
  const others = S.index.buys.filter(b => !(job.kind === "add" && b.id === S.buy.id));
  const has = {};
  if (job.kind === "add") for (const p of S.buy.pos) if (p.distro) has[p.po] = p.distro;
  job.chk = R.checkBatch(job.results, here, others, has);
  // what wasn't read, said once each
  if (job.skipped.length) job.chk.notes.push(job.skipped.length + " file" + (job.skipped.length > 1 ? "s" : "") + " skipped: not a PDF, an email or an Excel distro (" +
    job.skipped.slice(0, 6).join(", ") + (job.skipped.length > 6 ? " and " + (job.skipped.length - 6) + " more" : "") + ").");
  for (const e of job.empty) job.chk.notes.push(e + " has no attachments.");
}
function endJob(){ S.job = null; renderJob(); syncDrop(); }

const jobCount = job => job.chk ? job.chk.accepted.length + job.chk.distros.length : 0;
async function saveJob(){
  const job = S.job;
  if (!job || job.phase !== "check" || !jobCount(job)) return;
  if (job.kind === "new"){
    const name = ($("#jobName") && $("#jobName").value.trim()) || job.name;
    job.name = name;
  }
  job.phase = "saving"; job.at = 0; job.failed = null; job.uploaded = []; renderJob();
  const sig = c => c.accepted.map(p => p.po).join() + "|" + c.distros.map(d => d.po + ":" + (d.distro.version || 0)).join();
  const before = sig(job.chk);
  try {
    await recheck(job);
    if (sig(job.chk) !== before){
      job.phase = "check"; job.failed = "The buys list changed while you were looking: the checks have been run again. Look them over, then save.";
      renderJob(); return;
    }
    const id = job.kind === "new" ? newId() : S.buy.id;
    await ensurePath(PATHS.dir(id));
    const up = async (path, blob, type) => { if (job.cancelled) throw CANCELLED; job.at++; renderJob(); const it = await uploadPdf(path, blob, type); job.uploaded.push(path); return it; };
    const saved = [];
    for (const p of job.chk.accepted){
      const it = await up(PATHS.pdf(id, p.po), job.files.get(p.file), "application/pdf");
      saved.push(Object.assign({}, p, { file:{ name:p.file, path:PATHS.pdf(id, p.po), webUrl:it && it.webUrl } }));
    }
    const distros = [];
    for (const d of job.chk.distros){
      const ext = extOf(d.file) || "pdf";
      await up(PATHS.distro(id, d.po, d.distro.version, ext), job.files.get(d.file), ext === "pdf" ? "application/pdf" : "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      distros.push(Object.assign({}, d.distro, { file:{ name:d.file, ext }, added:new Date().toISOString(), addedBy:me() }));
    }
    if (job.cancelled) throw CANCELLED;
    // a distro goes on its PO (the check above decided it may), unless the buy as saved now no longer has that PO or
    // has a newer distro for it (someone else's save meanwhile): those are said, and their uploaded files removed
    const attach = pos => {
      const replaced = [], lost = [];
      for (const d of distros){
        const p = pos.find(x => x.po === d.po);
        if (!p || (p.distro && (p.distro.version || 0) > (d.version || 0))){ lost.push(d); continue; }
        if (p.distro) replaced.push(PATHS.distro(id, p.po, p.distro.version, p.distro.file && p.distro.file.ext));
        p.distro = d;
      }
      return { replaced, lost };
    };
    let buy, out = { replaced:[], lost:[] };
    if (job.kind === "new"){
      const now = new Date().toISOString();
      out = attach(saved);
      buy = { v:1, id, name:job.name, customer:job.key, created:now, by:me(), updated:now, updatedBy:me(), pos:saved, notes:{} };
      await writeJson(PATHS.buy(id), buy, null);
    } else {
      buy = await mutateBuy(id, d => { for (const p of saved) if (!d.pos.some(x => x.po === p.po)) d.pos.push(p); out = attach(d.pos); });
    }
    // an older distro's file goes once the newer one is saved in its place; a distro that found no place goes too
    for (const path of out.replaced) if (!job.uploaded.includes(path)) await delItem(path).catch(e => console.error(e));
    for (const d of out.lost) await delItem(PATHS.distro(id, d.po, d.version, d.file.ext)).catch(e => console.error(e));
    await updateIndex(putEntry(buy));
    S.job = null;
    if (out.lost.length) setSave("Saved, but not the distro for " + out.lost.map(d => d.po).join(", ") + ": someone else removed the PO or saved a newer distro meanwhile.", true);
    else setSave("Saved");
    if (job.kind === "new") location.hash = "#/buy/" + id;
    else { S.adding = false; renderBuy(); }
  } catch(e){
    if (e === CANCELLED){
      // a new buy's files go; on an existing buy only the files this save uploaded (none is in the buy yet)
      try {
        if (job.kind === "new"){ if (job.newId) await delItem(PATHS.dir(job.newId)); }
        else for (const path of job.uploaded || []) await delItem(path);
      } catch(e2){ console.error(e2); }
      if (S.job === job) endJob();
      return;
    }
    job.phase = "check"; job.failed = "Not saved: " + errMsg(e); renderJob();
  }
}
function newId(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const id = "b" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + Math.random().toString(36).slice(2, 8);
  if (S.job) S.job.newId = id;
  return id;
}

/* ============================== RENDER: the job panel ============================== */
function renderJob(){
  const box = $("#job");
  if (!box) return;
  const job = S.job;
  syncDrop();
  if (!job){ box.innerHTML = ""; return; }
  if (job.phase === "reading" || job.phase === "saving"){
    const n = job.phase === "reading" ? job.total : jobCount(job);
    const what = job.phase === "reading" ? "Reading " + job.at + " of " + n + (job.current ? " · " + esc(job.current) : "") : "Saving " + job.at + " of " + n + " files to SharePoint";
    box.innerHTML = '<div class="strip busy"><div class="spin"></div><span>' + what + '…</span><div class="spacer"></div><button class="btn sm" data-act="cancelJob">Cancel</button></div>';
    return;
  }
  const chk = job.chk || { accepted:[], refused:[], notes:[], distros:[] };
  const acc = chk.accepted, dis = chk.distros;
  // the buy as it would be: its POs, the new ones, and each distro on its PO
  const pos = (job.kind === "add" ? S.buy.pos : []).concat(acc).map(p => { const d = dis.find(x => x.po === p.po); return d ? Object.assign({}, p, { distro:d.distro }) : p; });
  const fl = acc.length || dis.length ? R.flags(job.key, pos) : [];
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  let h = "";
  if (job.failed) h += '<div class="strip err">' + esc(job.failed) + "</div>";
  if (job.kind === "new")
    h += '<div class="row"><label class="fld grow"><span>Buy name</span><input id="jobName" value="' + esc(job.name) + '" maxlength="80"></label></div>';
  if (acc.length || dis.length){
    const bits = [];
    if (acc.length){
      const rc = R.recap({ customer:job.key, pos:acc });
      bits.push("<b>" + plural(acc.length, "PO") + "</b> · " + R.fmt(rc.total.units) + " units · " + R.money(rc.total.ext) + " · " + plural(rc.windows.length, "ship window"));
    }
    if (dis.length) bits.push("<b>" + plural(dis.length, "distro") + "</b> for " + dis.map(d => esc(d.po) + (d.replaces ? " (replaces version " + esc(d.replaces) + ")" : "")).join(", "));
    h += '<div class="strip ok"><span>Ready to ' + (job.kind === "new" ? "save" : "add") + ": " + bits.join(" · ") + "</span></div>";
  } else {
    h += '<div class="strip err"><b>Nothing here can be ' + (job.kind === "new" ? "saved" : "added") + ".</b></div>";
  }
  if (chk.refused.length)
    h += '<div class="strip err"><b>' + chk.refused.length + " refused</b><ul>" + chk.refused.map(r =>
      "<li>" + esc(r.file) + (r.po ? " · PO " + esc(r.po) : "") + ' · <span class="why">' + esc(r.why) + "</span></li>").join("") + "</ul></div>";
  if (chk.notes.length) h += '<div class="strip"><ul>' + chk.notes.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul></div>";
  if (fl.length)
    h += '<div class="strip warn"><b>' + fl.length + " flag" + (fl.length > 1 ? "s" : "") + (job.kind === "add" ? " on the buy once these are added" : " to look at") + "</b><ul>" +
         fl.map(f => "<li>" + esc(f.text) + "</li>").join("") + "</ul></div>";
  if (acc.length){
    const tones = R.recap({ customer:job.key, pos:acc }).tones;
    h += '<div class="tw"><table class="t"><thead><tr><th>PO</th><th>Banner</th><th>Reference</th><th>Ship window</th><th class="n">Lines</th><th class="n">Units</th><th class="n">Cost</th><th>File</th></tr></thead><tbody>' +
      acc.map(p => {
        const ext = p.lines.reduce((t, l) => t + Math.round(l.units * l.cost * 100), 0) / 100;
        return "<tr><td>" + esc(p.po) + "</td><td>" + esc(p.banner) + "</td><td>" + esc(p.ref) + "</td><td>" + swatch(tones[p.po]) + R.md(p.startShip) + "–" + R.md(p.cancel) +
          '</td><td class="n">' + p.lines.length + '</td><td class="n">' + R.fmt(p.totalUnits) + '</td><td class="n">' + R.money(ext) + "</td><td>" + esc(p.file) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  const what = [acc.length && plural(acc.length, "PO"), dis.length && plural(dis.length, "distro")].filter(Boolean).join(" and ");
  h += '<div class="row"><button class="btn primary" data-act="saveJob"' + (acc.length || dis.length ? "" : " disabled") + ">" + (job.kind === "new" ? "Save buy" : "Add " + (what || "nothing")) +
       '</button><button class="btn" data-act="cancelJob">Cancel</button></div>';
  box.innerHTML = h;
}

/* ============================== RENDER: a buy ============================== */
async function openBuy(id){
  S.view = "buy"; S.adding = false; S.pick.clear();
  if (S.task) S.task.cancelled = true;
  S.task = null;
  dropJob();
  $("#view").innerHTML = '<a class="back" href="#/">‹ All buys</a><div class="card"><div class="inline-load"><div class="spin"></div>Loading the buy…</div></div>';
  try {
    const got = await readJson(PATHS.buy(id));
    if (S.view !== "buy" || location.hash !== "#/buy/" + id) return;
    if (!got){ $("#view").innerHTML = '<a class="back" href="#/">‹ All buys</a><div class="card"><div class="empty">This buy isn\'t there any more: someone deleted it.</div></div>'; return; }
    setBuy(got.data, got.etag);
    renderBuy();
    loadMaster();
  } catch(e){
    $("#view").innerHTML = '<a class="back" href="#/">‹ All buys</a><div class="card"><div class="empty" style="color:var(--bad)">The buy couldn\'t be loaded: ' + esc(errMsg(e)) + "</div></div>";
  }
}
/* What someone is typing in the name or a note, kept across a re-render (Master Sheet Live arriving, say) */
function captureEdits(){
  const out = [];
  for (const el of [$("#buyName"), ...document.querySelectorAll("input.note")].filter(Boolean)){
    const k = fieldKey(fieldOf(el)), focused = document.activeElement === el;
    if (focused || S.timers.has(k)) out.push({ k, value:el.value, focused, a:el.selectionStart, z:el.selectionEnd });
  }
  return out;
}
function restoreEdits(list){
  for (const e of list){
    const el = e.k === "name" ? $("#buyName") : [...document.querySelectorAll("input.note")].find(x => fieldKey(fieldOf(x)) === e.k);
    if (!el) continue;
    el.value = e.value;
    if (e.focused){ el.focus(); try { el.setSelectionRange(e.a, e.z); } catch(x){} }
  }
}
const masterData = () => (S.master && S.master.data) || null;
function renderBuy(){
  const keep = captureEdits();
  const b = S.buy, master = masterData(), rc = R.recap(b), fl = R.flags(b.customer, b.pos, master), cust = R.customer(b.customer) || { name:b.customer };

  for (const po of [...S.pick]) if (!b.pos.some(p => p.po === po)) S.pick.delete(po);
  const sm = rc.summary;
  const ordered = sm.orderFrom === sm.orderTo ? R.mdy(sm.orderFrom) : R.mdy(sm.orderFrom) + " – " + R.mdy(sm.orderTo);
  const withD = b.pos.filter(p => p.distro).length, noFob = b.pos.filter(p => !("fob" in p));
  const fobs = [...new Set(b.pos.filter(p => "fob" in p).map(p => R.fobLabel(p.fob) || "not read"))];
  const fobOff = cust.fobLA && b.pos.some(p => !R.fobIsLA(p.fob));
  let h = '<a class="back" href="#/">‹ All buys</a>';
  h += '<section class="card"><div class="head"><label class="fld name"><span>Buy</span><input id="buyName" value="' + esc(b.name) + '" maxlength="80"></label>' +
       '<button class="btn" data-act="addOpen"' + (cust.read ? "" : " disabled") + '>Add POs or distros</button><button class="btn" data-act="exportOne">Export</button>' +
       (isAdmin() ? '<button class="btn danger" data-act="delBuy">Delete</button>' : "") + "</div>" +
       '<div class="meta">' + esc(cust.name) + " · created " + dayOf(b.created) + " by " + esc(b.by) + (b.updatedBy && b.updated !== b.created ? " · last changed " + dayOf(b.updated) + " by " + esc(b.updatedBy) : "") +
       " · buyer " + esc(sm.buyers.join(", ") || "—") + " · ordered " + ordered + (sm.depts.length ? " · dept " + esc(sm.depts.join(", ")) : "") + "</div>" +
       '<div class="job" id="taskStrip"></div>' +
       (noFob.length && !S.task ? '<div class="job"><div class="strip"><span>' + noFob.length + " PO" + (noFob.length > 1 ? "s were" : " was") +
         " saved before FOB point was read, so it isn't shown or checked for " + (noFob.length > 1 ? "them" : "it") + '.</span><div class="spacer"></div><button class="btn sm" data-act="readFob">Read FOB from their PDFs</button></div></div>' : "") +
       (S.adding ? '<div class="imp"><div class="drop off" id="drop" tabindex="0" role="button" aria-disabled="true"><div class="arrow">↓</div><div><b>Drop ' + esc(cust.name) + ' POs or distros to add here</b><span class="hint" id="dropHint"></span></div></div>' +
                   '<div class="drops"><button class="btn" id="pickFolder" data-act="pickFolder" disabled>Pick a folder</button><button class="btn" data-act="addClose">Cancel</button></div></div><div class="job" id="job"></div>' : "") +
       "</section>";
  h += '<div class="kpis">' +

       kpi(R.money(rc.total.ext), "Cost", "at the PO's unit costs") +
       kpi(rc.windows.length, "Ship windows", rc.windows.length ? rc.windows[0].label + (rc.windows.length > 1 ? " to " + rc.windows[rc.windows.length - 1].label : "") : "") +

       kpi(esc(fobs.join(", ") || "—"), "FOB point", noFob.length ? noFob.length + " not read yet" : fobOff ? "not LA: flagged" : cust.fobLA ? "LA" : "", fobOff) + "</div>";
  h += '<div class="pair"><section class="card"><div class="card-hd"><h2>By ship window</h2></div><div class="tw">' +
       miniTable("Ship window", rc.byWindow, "label") + '</div></section><section class="card"><div class="card-hd"><h2>By banner</h2></div><div class="tw">' +

  if (fl.length) h += '<section class="card"><div class="card-hd"><h2>Flags · ' + fl.length + '</h2><div class="spacer"></div><span class="hint">Worked out from the POs every time the buy opens</span></div><ul class="flags">' +

       '<div id="pickbar"></div><div class="tbl-scroll">' + recapTable(b, rc, fl, master) + "</div></section>";
  h += distroCard(b, rc, master);

  $("#view").innerHTML = h;
  restoreEdits(keep);
  renderJob(); syncDrop(); syncPick(); paintTask();

function masterStatus(){
  const m = S.master;
  if (!m || m.loading) return "Case packs: reading Master Sheet Live…";
  if (m.error) return 'Case packs not checked: ' + esc(m.error) + ' · <a href="#" data-act="masterRetry">Try again</a>';
  const t = m.at;
  return "Case packs checked against Master Sheet Live, read " + t.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) + ' · <a href="#" data-act="masterRetry">Read again</a>';
}
/* Master Sheet Live is read once per visit (about 2 MB). ensureMaster gives the read in progress, or starts one; the
   buy page re-renders when it arrives. Resolves to the data, or null when it couldn't be read (S.master.error says why). */
let masterRead = null;
function ensureMaster(force){
  if (masterRead && !force && !(S.master && S.master.error)) return masterRead;
  S.master = { loading:true };
  const st = $("#masterSt"); if (st) st.innerHTML = masterStatus();
  masterRead = readMaster().then(data => { S.master = { data, at:new Date() }; return data; }, e => { S.master = { error:errMsg(e) }; return null; });
  return masterRead;
}
function loadMaster(force){
  ensureMaster(force).then(() => { if (S.view === "buy" && S.buy) renderBuy(); });
}
function paintTask(){
  const box = $("#taskStrip");
  if (!box) return;
  box.innerHTML = S.task ? '<div class="strip busy"><div class="spin"></div><span>' + esc(S.task.what) + '…</span><div class="spacer"></div>' +
    (S.task.noCancel ? "" : '<button class="btn sm" data-act="taskCancel">Cancel</button>') + "</div>" : "";
}
function syncPick(){
  const bar = $("#pickbar");
  if (!bar) return;
  const n = S.pick.size;
  bar.innerHTML = n ? '<div class="pickbar"><b>' + n + " PO" + (n > 1 ? "s" : "") + " ticked</b> · " + [...S.pick].sort().map(esc).join(", ") +
    '<div class="spacer"></div><button class="btn sm primary" data-act="pickMove"' + (S.task ? " disabled" : "") + '>Move to another buy…</button><button class="btn sm" data-act="pickClear">Clear</button></div>' : "";
  for (const c of document.querySelectorAll('input[data-act="pick"]')) c.checked = S.pick.has(c.dataset.po);
}
const kpi = (v, label, sub, mark) => '<div class="card kpi"><span class="lbl">' + label + '</span><div class="v' + (mark === "warn" ? " warn" : mark ? " bad" : "") + '">' + v + '</div><div class="s">' + (sub || "") + "</div></div>";
function miniTable(head, list, key){
  return '<table class="t"><thead><tr><th>' + head + '</th><th class="n">POs</th><th class="n">Units</th><th class="n">Cost</th></tr></thead><tbody>' +
    list.map(x => "<tr><td>" + swatch(x.tone) + esc(x[key]) + '</td><td class="n">' + x.pos + '</td><td class="n">' + R.fmt(x.units) + '</td><td class="n">' + R.money(x.ext) + "</td></tr>").join("") + "</tbody></table>";
}
function recapTable(b, rc, fl, master){
  const flagged = new Map();
  for (const f of fl) if (f.style) (flagged.get(f.style) || flagged.set(f.style, []).get(f.style)).push(f.text);
  const cols = rc.windows.flatMap(w => w.banners.flatMap(x => x.pos));
  const notes = b.notes || {};
  // each ship window in its colour, with a heavier line where the dates change
  const starts = new Set(rc.windows.map(w => w.banners[0].pos[0].po));
  const tone = p => "t" + rc.tones[p.po] + (starts.has(p.po) ? " wst" : "");
  // a dot under each PO for its distro: green when it's in and matches, red when it doesn't, grey when not in yet
  const dot = p => {
    if (!p.distro) return '<i class="dd" data-tip="No distro yet for PO ' + esc(p.po) + '"></i>';
    const n = R.distroIssues(p).length;
    return '<i class="dd ' + (n ? "bad" : "ok") + '" data-tip="' + esc(n ? n + " thing" + (n > 1 ? "s" : "") + " on PO " + p.po + "'s distro to look at (see Distro below)" : "PO " + p.po + "'s distro is in and matches") + '"></i>';
  };
  let h = '<table class="g"><thead><tr class="h0">' +
    '<th rowspan="3" class="fz c-style lab">Style</th><th rowspan="3" class="fz c-desc lab">Description</th><th rowspan="3" class="fz c-cost lab n">Cost</th><th rowspan="3" class="fz c-pack lab n">Pack</th>' +
    rc.windows.map(w => '<th class="win t' + w.tone + ' wst" colspan="' + w.banners.reduce((t, x) => t + x.pos.length, 0) + '">' + esc(w.label) + "</th>").join("") +
    '<th rowspan="3" class="lab n">Total units</th><th rowspan="3" class="lab n">Ext cost</th><th rowspan="3" class="lab">Notes</th></tr><tr class="h1">' +
    rc.windows.map(w => w.banners.map((x, j) => '<th class="t' + w.tone + (j ? "" : " wst") + '" colspan="' + x.pos.length + '">' + esc(x.banner) + "</th>").join("")).join("") + '</tr><tr class="h2">' +
    cols.map(p => '<th class="' + tone(p) + '"><label><input type="checkbox" data-act="pick" data-po="' + esc(p.po) + '" aria-label="Tick PO ' + esc(p.po) + ' to move it"' + (S.pick.has(p.po) ? " checked" : "") + ">" +
      (pdfLink(b, p) ? '<a href="' + esc(pdfLink(b, p)) + '" target="_blank" rel="noopener" title="Open PO ' + esc(p.po) + '">' + esc(p.po) + "</a>" : esc(p.po)) + "</label>" + dot(p) + "</th>").join("") + "</tr></thead><tbody>";
  for (const r of rc.rows){
    const f = flagged.get(r.style), odd = r.varies.cost || r.varies.desc;
    // a style whose cost or description isn't the same on every PO: its cells go red, each with what its PO says
    const cell = p => !r.cells[p.po] ? '<td class="n blank ' + tone(p) + '"></td>'
      : odd ? '<td class="n bad ' + tone(p) + '" data-tip="' + esc(R.cellTip(r, p.po)) + '">' + R.fmt(r.cells[p.po].units) + "</td>"
      : '<td class="n ' + tone(p) + '">' + R.fmt(r.cells[p.po].units) + "</td>";
    h += '<tr><td class="fz c-style">' + esc(r.style) + (f ? '<span class="flag" data-tip="' + esc(f.join("\n")) + '">⚑</span>' : "") + "</td>" +
         (r.varies.desc ? '<td class="fz c-desc bad" data-tip="' + esc(R.variantsTip(r, "desc")) + '">' : '<td class="fz c-desc" title="' + esc(r.desc) + '">') + esc(r.desc) + "</td>" +
         (r.varies.cost ? '<td class="fz c-cost n bad" data-tip="' + esc(R.variantsTip(r, "cost")) + '">' + esc(r.costs.map(c => R.money(c)).join(" / ")) : '<td class="fz c-cost n">' + R.money(r.cost)) + "</td>" +
         packTd(r, master) +
         cols.map(cell).join("") +
         '<td class="n tot">' + R.fmt(r.total) + '</td><td class="n">' + R.money(r.ext) + '</td><td class="note"><input class="note" data-style="' + esc(r.style) + '" value="' + esc(notes[r.style] || "") +
         '" aria-label="Notes for ' + esc(r.style) + '" maxlength="300"></td></tr>';
  }
  h += '</tbody><tfoot><tr><td class="fz c-style">Total</td><td class="fz c-desc"></td><td class="fz c-cost"></td><td class="fz c-pack"></td>' +

/* The Distro card: each PO's distribution instructions by DC, what doesn't match red with the reason on hover */
function distroCard(b, rc, master){
  const withD = rc.pos.filter(p => p.distro), missing = rc.pos.filter(p => !p.distro);
  let h = '<section class="card"><div class="card-hd"><h2>Distro · ' + withD.length + " of " + rc.pos.length + ' in</h2><div class="spacer"></div><span class="hint">Drop TJX\'s distribution instructions (PDF or Excel) with Add POs or distros: each attaches to its PO</span></div>';
  if (!withD.length) return h + '<div class="empty">No distros yet.</div></section>';
  for (const p of withD){
    const d = p.distro, issues = R.distroIssues(p);
    const at = (style, dc) => issues.filter(i => i.style === style && (dc === undefined || i.dc === dc));
    const poBy = new Map(), dBy = new Map();
    for (const l of p.lines){ const s = poBy.get(l.style) || { units:0, desc:l.desc, pack:l.pack }; s.units += l.units; poBy.set(l.style, s); }
    for (const l of d.lines){
      const s = dBy.get(l.style) || { total:0, desc:l.desc, pack:l.pack, units:{} };
      s.total += l.total; for (const [dc, u] of Object.entries(l.units)) s.units[dc] = (s.units[dc] || 0) + u; dBy.set(l.style, s);
    }
    const tipCell = (cls, text, tips) => '<td class="' + cls + (tips.length ? " bad" : "") + '"' + (tips.length ? ' data-tip="' + esc(tips.map(i => i.text).join("\n")) + '"' : "") + ">" + text + "</td>";
    let rows = "";
    for (const style of [...new Set([...poBy.keys(), ...dBy.keys()])]){
      const a = poBy.get(style), x = dBy.get(style), mine = at(style).filter(i => !i.dc);
      const m = master ? R.masterPack(master, style) : null, pack = x ? x.pack : a.pack;
      const packTips = (a && x && a.pack !== x.pack ? mine.filter(i => /pack/.test(i.text)) : []).concat(m && m.pack != null && m.pack !== pack ? [{ text:R.masterSays(m) }] : []);
      rows += "<tr><td" + (mine.length ? ' class="bad" data-tip="' + esc(mine.map(i => i.text).join("\n")) + '"' : "") + ">" + esc(style) + "</td><td>" + esc((a || x).desc) + "</td>" +
        tipCell("n", esc(pack), packTips) +
        tipCell("n", a ? R.fmt(a.units) : "not on PO", a ? [] : mine) +
        tipCell("n", x ? R.fmt(x.total) : "not on distro", x ? mine.filter(i => /units;/.test(i.text)) : mine) +
        d.dcs.map(c => { const u = x ? x.units[c.dc] : undefined; return tipCell("n", u === undefined ? "" : R.fmt(u), u === undefined ? [] : at(style, c.dc)); }).join("") + "</tr>";
    }
    const general = issues.filter(i => !i.style);
    const tone = rc.tones[p.po];
    h += '<details class="dist"' + (issues.length ? " open" : "") + "><summary>" + swatch(tone) + "<b>PO " + esc(p.po) + "</b><span>" + esc(p.banner) + " · ship " + R.md(p.startShip) + "–" + R.md(p.cancel) + "</span>" +
      '<span class="muted">distro' + (d.version ? " v" + esc(d.version) : "") + (d.versionDate ? ", " + R.mdy(d.versionDate) : "") + " · " + d.dcs.length + " DCs</span>" +
      (distroLink(b, p) ? '<a href="' + esc(distroLink(b, p)) + '" target="_blank" rel="noopener">' + esc(baseName(d.file && d.file.name || "distro")) + "</a>" : "") +
      '<span class="' + (issues.length ? "bad-t" : "ok-t") + '">' + (issues.length ? issues.length + " to look at" : "matches the PO ✓") + "</span></summary>" +
      (general.length ? '<div class="job"><div class="strip err"><ul>' + general.map(i => "<li>" + esc(i.text) + "</li>").join("") + "</ul></div></div>" : "") +
      '<div class="tw"><table class="t"><thead><tr><th>Style</th><th>Description</th><th class="n">Pack</th><th class="n">PO units</th><th class="n">Distro units</th>' +
      d.dcs.map(c => '<th class="n" title="' + esc(c.name) + '">' + esc((c.code ? c.code + " " : "") + c.dc) + "</th>").join("") + "</tr></thead><tbody>" + rows + "</tbody></table></div></details>";
  }
  if (missing.length) h += '<div class="meta" style="padding-top:10px">No distro yet: ' + missing.map(p => swatch(rc.tones[p.po]) + esc(p.po)).join(", ") + "</div>";
  return h + "</section>";
}

/* POs saved before FOB point was read: read it from their PDFs in SharePoint, and fill in only that */
async function readFobFromPdfs(){
  const b = S.buy;
  if (!b || S.task) return;
  const need = b.pos.filter(p => !("fob" in p));
  const task = S.task = { what:"Reading FOB point", cancelled:false };
  paintTask(); renderBuy();
  const got = {};
  try {
    for (const [i, p] of need.entries()){
      if (task.cancelled) throw CANCELLED;
      task.what = "Reading FOB point from PO " + p.po + " (" + (i + 1) + " of " + need.length + ")"; paintTask();
      const r = R.read(b.customer, await pdfPages(await downloadBytes(PATHS.pdf(b.id, p.po)), task));
      got[p.po] = r.po ? r.po.fob : null;
    }
    task.noCancel = true; task.what = "Saving"; paintTask();
    await mutateBuy(b.id, d => { for (const p of d.pos) if (p.po in got && !("fob" in p)) p.fob = got[p.po]; });
    if (S.task === task) S.task = null;
    setSave("FOB point read for " + need.length + " PO" + (need.length > 1 ? "s" : ""));
  } catch(e){
    if (S.task === task) S.task = null;
    if (e !== CANCELLED) setSave("FOB point not read: " + errMsg(e), true);
  }
  if (S.view === "buy" && S.buy && S.buy.id === b.id) renderBuy();
}

/* The files move first (and move back if anything fails before a buy file changes), then the target buy gets the POs,
   then this buy lets them go, then the list. The notes on their styles are copied; a style the target already has a
   different note on keeps both. */
async function movePos(pos, targetId, newName){
  const srcId = S.buy.id;
  const task = S.task = { what:"Moving " + pos.length + " PO" + (pos.length > 1 ? "s" : ""), cancelled:false };
  syncPick(); paintTask();
  // the name and notes are locked while the move runs; anything still being typed is saved first, so the notes that
  // go with the POs are the newest
  const locked = [$("#buyName"), ...document.querySelectorAll("input.note")].filter(Boolean);
  for (const el of locked){ if (S.timers.has(fieldKey(fieldOf(el)))) flush(el); el.disabled = true; }
  await S.chain;
  const tid = targetId || newId(), moved = [];
  let wroteTarget = false, target = null;
  // a file that's already in the target folder (a move cut short by a reload) counts as moved, so running the move
  // again finishes it
  const move = async (from, to, file) => {
    try { await moveItem(from, PATHS.dir(to)); }
    catch(e){
      if (e.status !== 404) throw e;
      try { await gf(itemUrl(PATHS.dir(to) + "/" + file) + "?$select=id"); return; } catch(e2){ throw e; }
    }
  };
  try {
    const got = await readJson(PATHS.buy(srcId));
    if (!got) throw new Error("this buy isn't there any more: someone deleted it");
    const src = got.data, moving = src.pos.filter(p => pos.includes(p.po));
    if (moving.length !== pos.length) throw new Error("someone else changed this buy: " + pos.filter(po => !moving.some(p => p.po === po)).join(", ") + " isn't in it any more. Reload and tick again");
    for (const p of moving){
      if (task.cancelled) throw CANCELLED;
      task.what = "Moving PO " + p.po + "'s files"; paintTask();
      await move(PATHS.pdf(srcId, p.po), tid, p.po + ".pdf"); moved.push([PATHS.pdf(tid, p.po), PATHS.dir(srcId)]);
      if (p.distro){ const f = distroPath(srcId, p); await move(f, tid, f.split("/").pop()); moved.push([distroPath(tid, p), PATHS.dir(srcId)]); }
    }
    if (task.cancelled) throw CANCELLED;
    task.noCancel = true; task.what = "Saving both buys"; paintTask();
    const styles = new Set(moving.flatMap(p => p.lines.map(l => l.style)));
    const notes = {};
    for (const s of styles) if (src.notes && src.notes[s]) notes[s] = src.notes[s];
    const recs = moving.map(p => Object.assign({}, p, { file:Object.assign({}, p.file, { path:PATHS.pdf(tid, p.po) }) }));
    if (!targetId){
      const now = new Date().toISOString();
      target = { v:1, id:tid, name:newName, customer:src.customer, created:now, by:me(), updated:now, updatedBy:me(), pos:recs, notes, splitFrom:{ id:srcId, name:src.name } };
      await writeJson(PATHS.buy(tid), target, null);
    } else {
      target = await mutateBuy(tid, d => {
        for (const r of recs) if (!d.pos.some(x => x.po === r.po)) d.pos.push(r);
        d.notes = d.notes || {};
        for (const [s, n] of Object.entries(notes)) d.notes[s] = d.notes[s] && d.notes[s] !== n ? d.notes[s] + " · " + n : n;
      });
    }
    wroteTarget = true;
    // on the list at once, so it can be found even if this buy can't be updated below
    await updateIndex(putEntry(target));
    const left = await mutateBuy(srcId, d => {
      d.pos = d.pos.filter(p => !pos.includes(p.po));
      const still = new Set(d.pos.flatMap(p => p.lines.map(l => l.style)));
      for (const s of Object.keys(d.notes || {})) if (!still.has(s)) delete d.notes[s];
    });
    await updateIndex(putEntry(left));
    if (S.task === task) S.task = null;
    S.pick.clear();
    setSave("Moved " + pos.join(", ") + " to “" + target.name + "”");
  } catch(e){
    if (S.task === task) S.task = null;
    if (!wroteTarget) for (const [path, back] of moved.reverse()) await moveItem(path, back).catch(x => console.error(x));
    setSave(e === CANCELLED ? "Move cancelled: nothing moved." : wroteTarget
      ? "The POs reached “" + (target && target.name) + "” but couldn't be taken off this buy: " + errMsg(e) + ". Reload, then tick them and move them to “" + (target && target.name) + "” again to finish."
      : "Not moved (the files are back): " + errMsg(e), e !== CANCELLED);
  }
  if (S.view === "buy" && S.buy && S.buy.id === srcId){
    const fresh = await readJson(PATHS.buy(srcId)).catch(() => null);
    if (fresh) setBuy(fresh.data, fresh.etag);
    renderBuy();
  }
}

/* ============================== AUTOSAVE: the name and the notes ============================== */
// 600 ms after typing stops, and on leaving the field. Each save is made on the buy as SharePoint has it now: when
// someone else changed the same field in the meantime, it isn't saved and their value is shown.
const fieldKey = path => path.join("\u0001");
const getField = (d, path) => path[0] === "name" ? d.name : ((d.notes || {})[path[1]] || "");
function setField(d, path, v){
  if (path[0] === "name"){ d.name = v; return; }
  d.notes = d.notes || {};
  if (v) d.notes[path[1]] = v; else delete d.notes[path[1]];
}
function fieldOf(el){ return el.id === "buyName" ? ["name"] : el.classList.contains("note") ? ["notes", el.dataset.style] : null; }
function schedule(el){
  const path = fieldOf(el); if (!path) return;
  const k = fieldKey(path);
  clearTimeout(S.timers.get(k));
  S.timers.set(k, setTimeout(() => flush(el), 600));
}
function flush(el){
  const path = fieldOf(el); if (!path || !S.buy) return;
  const k = fieldKey(path);
  clearTimeout(S.timers.get(k)); S.timers.delete(k);
  const id = S.buy.id, to = el.value.trim();
  if (path[0] === "name" && !to){ setSave("A buy needs a name, so the old one is kept.", true); el.value = S.base.get(k); return; }
  S.chain = S.chain.then(() => saveField(id, path, to, el)).catch(e => console.error(e));
}
async function saveField(id, path, to, el){
  const k = fieldKey(path), from = S.base.has(k) ? S.base.get(k) : "";
  if (to === from || !S.buy || S.buy.id !== id) return;
  setSave("Saving…");
  try {
    const data = await mutateBuy(id, d => {
      const now = getField(d, path);
      if (now !== from && now !== to){ const e = new Error("conflict"); e.conflict = true; throw e; }
      setField(d, path, to);
    });
    S.base.set(k, to);
    showSaved(data);
    if (path[0] === "name") await updateIndex(putEntry(data));
    setSave("Saved");
  } catch(e){
    if (!e.conflict){ setSave("Not saved: " + errMsg(e), true); return; }
    const got = await readJson(PATHS.buy(id)).catch(() => null);
    if (got && S.buy && S.buy.id === id) setBuy(got.data, got.etag);
    const theirs = got ? getField(got.data, path) : from;
    S.base.set(k, theirs);
    if (el) el.value = theirs;   // the box shows what's saved, never text that wasn't
    if (got) showSaved(got.data);
    const what = path[0] === "name" ? "the name" : "the note on " + path[1];
    setSave("Not saved: someone else changed " + what + " to “" + theirs + "” while you were typing.", true);
  }
}
/* After a save made on someone else's newer copy, show their changes in the fields nobody is typing in here */
function showSaved(d){
  const els = [$("#buyName"), ...document.querySelectorAll("input.note")].filter(Boolean);
  for (const el of els){
    const path = fieldOf(el), k = fieldKey(path);
    if (S.timers.has(k) || document.activeElement === el) continue;
    const v = getField(d, path);
    if (el.value.trim() !== v) el.value = v;
    S.base.set(k, v);
  }
}
let saveTimer = 0;
function setSave(text, bad){
  const el = $("#saveSt"); if (!el) return;
  el.textContent = text; el.className = "save" + (bad ? " err" : "");
  clearTimeout(saveTimer);
  if (!bad && text === "Saved") saveTimer = setTimeout(() => { if (el.textContent === "Saved") el.textContent = ""; }, 4000);
}

/* ============================== EXPORT ============================== */
async function exportBuys(ids){
  if (typeof XLSX === "undefined"){ setSave("The Excel library didn't load (cdn.jsdelivr.net blocked?).", true); return; }
  setSave("Making the Excel file…");
  try {
    const wb = XLSX.utils.book_new(), used = new Set(), names = [];
    for (const id of ids){
      const b = S.buy && S.buy.id === id ? S.buy : ((await readJson(PATHS.buy(id))) || {}).data;
      if (!b) continue;
      // the case packs are checked on the sheet only against Master Sheet Live: read it first if it isn't yet, and say
      // on the sheet when it couldn't be
      if (!masterData()){ setSave("Reading Master Sheet Live for the case packs…"); await ensureMaster(); }
      const master = masterData();
      const packNote = master ? "checked against Master Sheet Live, read " + S.master.at.toLocaleString([], { month:"numeric", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" })
                              : "NOT checked: Master Sheet Live couldn't be read (" + ((S.master && S.master.error) || "unknown") + ")";
      XLSX.utils.book_append_sheet(wb, R.worksheet(b, null, master, { packNote, packChecked:!!master }), R.sheetName(b.name, used));
      const ds = R.distroSheet(b, master);
      if (ds) XLSX.utils.book_append_sheet(wb, ds, R.sheetName(b.name, used, " distro"));
      names.push(b.name);
    }
    if (!names.length){ setSave("Nothing to export: those buys aren't there any more.", true); return; }
    const d = new Date();
    const file = (names.length === 1 ? names[0] : "PO Recap " + (d.getMonth() + 1) + "-" + d.getDate() + "-" + d.getFullYear()).replace(/[\\/:*?"<>|]/g, "-");
    XLSX.writeFile(wb, file + ".xlsx");
    setSave("Exported " + names.length + " buy" + (names.length > 1 ? "s" : ""));
  } catch(e){ setSave("Not exported: " + errMsg(e), true); }
}

function confirmBox(title, body, ok){

async function deleteBuy(){

async function removePo(po){
  const b = S.buy;
  if (!b || !isAdmin()) return;
  const had = b.pos.find(p => p.po === po);
  if (!await confirmBox("Remove PO " + po + "?", "It leaves “" + b.name + "”, and its PDF" + (had && had.distro ? " and distro go" : " goes") + " to the SharePoint recycle bin. You can drop it in again with Add POs.", "Remove PO")) return;
  setSave("Removing…");

    const data = await mutateBuy(b.id, d => { d.pos = d.pos.filter(p => p.po !== po); });
